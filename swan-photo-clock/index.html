<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Still / Moving — Live Photo Clock</title>
<meta name="description" content="A hand-drawn live clock, twelve overlapping photos, and a moving swan on the water. The hands always show your device's local time.">
<style>
  :root { color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { margin:0; width:100%; min-height:100%; background:#071b32; }
  body { display:grid; place-items:center; min-height:100dvh; overflow:hidden; }
  .scene {
    position:relative; flex:none;
    width:min(100vw, 60dvh); height:auto; aspect-ratio:3 / 5;
    overflow:hidden; isolation:isolate; background:#163b64;
    -webkit-tap-highlight-color:transparent;
  }
  .backdrop { position:absolute;inset:0;z-index:0;overflow:hidden; }
  .backdrop video {
    display:block; width:100%; height:100%; object-fit:cover; object-position:center 50%;
    filter:saturate(1.06) brightness(.79) contrast(1.02);
  }
  .backdrop:after { content:"";position:absolute;inset:0;background:rgba(8,21,49,.09);pointer-events:none; }
  .tile {
    position:absolute; z-index:var(--z, 2); overflow:visible;
    left:var(--x);top:var(--y);width:var(--w);height:var(--h);
    /* The edges must meet/overlap: no borders, rounded corners, drop shadows, mats or 3D. */
  }
  .tile img { display:block;width:100%;height:100%;object-fit:cover;border-radius:0;border:0;box-shadow:none; }
  .digit {
    position:absolute; pointer-events:none; overflow:visible;
    width:var(--dw, 34%); height:38%; left:var(--dx,6%); top:var(--dy,-6%);
    filter:none;
  }
  .digit path { fill:none;stroke:#fff;stroke-width:3.35;stroke-linecap:round;stroke-linejoin:round; }
  .clock { position:absolute;inset:0; z-index:20;display:block;overflow:visible;pointer-events:none; }
  .hand { stroke:#fff; fill:none; stroke-linecap:round;stroke-linejoin:round; }
  .hand.hour { stroke-width:5.4; }
  .hand.minute { stroke-width:5.9; }
  .hub { fill:#fff;stroke:#fff;stroke-width:2; }
  .time-aria { position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap; }
  @media (min-aspect-ratio:3/5) { .scene { width:min(100vw, 60dvh); } }
  @media (max-aspect-ratio:3/5) { .scene { width:100vw; } }
  @media (prefers-reduced-motion: reduce) { .backdrop video { animation:none; } }
</style>
</head>
<body>
<main class="scene" role="img" aria-label="A live local-time analog clock, made from twelve overlapping photographs over a moving swan video.">
  <div class="backdrop"><video src="./assets/swan.mp4" autoplay loop muted playsinline preload="auto" aria-hidden="true"></video></div>
  <!-- Tiles are CLOCKWISE, but are deliberately curated by colour, not by calendar month. -->
  <!-- x/y/w/h in percentages of the poster (960 x 1600 master composition). -->
  <div class="tile" data-hour="12" style="--x:36.8%;--y:10.6%;--w:26.1%;--h:14%;--z:5;--dx:34%;--dy:-9%;--dw:46%"><img src="./assets/12.webp" alt="" /></div>
  <div class="tile" data-hour="1" style="--x:58.8%;--y:17.4%;--w:23.8%;--h:14.1%;--z:6;--dx:67%;--dy:-8%"><img src="./assets/01.webp" alt="" /></div>
  <div class="tile" data-hour="2" style="--x:69.2%;--y:28%;--w:23.0%;--h:14.5%;--z:7;--dx:60%;--dy:-3%"><img src="./assets/02.webp" alt="" /></div>
  <div class="tile" data-hour="3" style="--x:69.5%;--y:40.9%;--w:22.3%;--h:14.1%;--z:8;--dx:66%;--dy:52%"><img src="./assets/03.webp" alt="" /></div>
  <div class="tile" data-hour="4" style="--x:65.7%;--y:53%;--w:22.8%;--h:14%;--z:9;--dx:66%;--dy:58%"><img src="./assets/04.webp" alt="" /></div>
  <div class="tile" data-hour="5" style="--x:55.8%;--y:63.2%;--w:23.8%;--h:13.6%;--z:10;--dx:66%;--dy:65%"><img src="./assets/05.webp" alt="" /></div>
  <div class="tile" data-hour="6" style="--x:38%;--y:67.6%;--w:25.1%;--h:13.5%;--z:11;--dx:41%;--dy:66%"><img src="./assets/06.webp" alt="" /></div>
  <div class="tile" data-hour="7" style="--x:19.0%;--y:63.7%;--w:24.4%;--h:14%;--z:12;--dx:3%;--dy:68%"><img src="./assets/07.webp" alt="" /></div>
  <div class="tile" data-hour="8" style="--x:10.5%;--y:52.8%;--w:23.8%;--h:14.0%;--z:13;--dx:3%;--dy:58%"><img src="./assets/08.webp" alt="" /></div>
  <div class="tile" data-hour="9" style="--x:8.4%;--y:40.5%;--w:24%;--h:14.4%;--z:14;--dx:1%;--dy:49%"><img src="./assets/09.webp" alt="" /></div>
  <div class="tile" data-hour="10" style="--x:12%;--y:28%;--w:23.7%;--h:14.7%;--z:15;--dx:0%;--dy:0%;--dw:45%"><img src="./assets/10.webp" alt="" /></div>
  <div class="tile" data-hour="11" style="--x:20.3%;--y:17.4%;--w:23.5%;--h:14.1%;--z:16;--dx:2%;--dy:-8%;--dw:46%"><img src="./assets/11.webp" alt="" /></div>
  <svg class="clock" viewBox="0 0 960 1600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- Exact center is (480,792); no printed dial or raised parts. -->
    <g id="minute-hand" class="hand minute">
      <path d="M480 794 C481.5 734 477.5 648 480.5 550" />
      <path d="M468 572 Q473.5 560 480.5 550 Q485 559 493 573" />
      <path d="M482 767 Q482.5 704 479.5 664" stroke-width="1.5" opacity=".65" />
    </g>
    <g id="hour-hand" class="hand hour">
      <path d="M481 791 Q480 721 480.5 628" />
      <path d="M470.5 645 Q475.5 635 480.5 628 Q486 635 491 644" />
    </g>
    <path class="hub" d="M469 793 Q471 784 480 784 Q491 783 492 793 Q491 802 481 804 Q469 803 469 793 Z" />
    <circle cx="481" cy="793" r="2.5" fill="#d7ebfa" opacity=".6" />
  </svg>
  <span class="time-aria" id="time-label"></span>
</main>
<script>
(() => {
  'use strict';
  // Tiny hand-drawn digit alphabet; deliberately not a heavy display font.
  const strokes = {
    '0': 'M18 4 Q30 3 29 22 Q29 43 17 46 Q3 43 5 24 Q7 5 18 4Z',
    '1': 'M5 11 Q11 8 18 3 Q18 24 17 46',
    '2': 'M5 12 Q7 1 20 4 Q34 7 27 21 Q21 32 5 44 Q16 46 31 43',
    '3': 'M6 7 Q21 0 28 11 Q28 20 16 24 Q29 24 29 35 Q28 48 7 44',
    '4': 'M26 3 Q17 16 5 32 Q17 31 30 31 M25 4 Q23 26 24 46',
    '5': 'M29 5 Q17 6 9 5 L7 23 Q16 18 25 25 Q35 37 23 44 Q12 49 5 41',
    '6': 'M26 5 Q12 16 9 29 Q5 43 17 46 Q30 46 29 34 Q27 22 11 28',
    '7': 'M4 6 Q17 5 30 5 Q17 26 13 46',
    '8': 'M17 4 Q31 4 27 17 Q24 24 17 26 Q3 32 6 40 Q10 48 21 45 Q36 40 25 29 Q12 20 7 14 Q7 6 17 4',
    '9': 'M26 27 Q13 33 8 24 Q2 13 13 6 Q25 1 28 15 Q31 30 16 46',
  };
  document.querySelectorAll('[data-hour]').forEach((tile) => {
    const hour = tile.dataset.hour;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    const w = hour.length === 2 ? 69 : 35;
    svg.setAttribute('class', 'digit');
    svg.setAttribute('viewBox', `0 0 ${w} 50`);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.setAttribute('aria-hidden','true');
    [...hour].forEach((digit, i) => {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', strokes[digit]);
      p.setAttribute('transform', `translate(${i * 34} 0) rotate(${i % 2 ? -3 : 2} 17 25)`);
      svg.appendChild(p);
    });
    tile.appendChild(svg);
  });
  const minuteHand = document.getElementById('minute-hand');
  const hourHand = document.getElementById('hour-hand');
  const sr = document.getElementById('time-label');
  let lastText = '';
  function tick() {
    const now = new Date(); // Viewer device's own current local time and timezone.
    const secs = now.getSeconds() + now.getMilliseconds()/1000;
    const minutes = now.getMinutes() + secs/60;
    const hours = (now.getHours() % 12) + minutes/60;
    minuteHand.setAttribute('transform', `rotate(${minutes * 6} 480 792)`);
    hourHand.setAttribute('transform', `rotate(${hours * 30} 480 792)`);
    const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    if (time !== lastText) { lastText = time; sr.textContent=`Local time ${time}`; }
    requestAnimationFrame(tick);
  }
  tick();
  const video = document.querySelector('video');
  video?.play().catch(() => { /* static first frame if autoplay is blocked */ });
  // Easy test hook for the hands, without changing the visible UI.
  window.__photoClock = { get localTime() { return new Date().toLocaleTimeString(); } };
})();
</script>
</body>
</html>
